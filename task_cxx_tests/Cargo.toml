[package]
name = "task_cxx_tests"
version = "0.1.0"
edition = "2024"
# End-to-end tests for the generated C++ views.
publish = false

[dependencies]
task = { path = "../task", optional = true }
task_graph = { path = "../task_graph", optional = true }
task_cxx = { path = "../task_cxx", optional = true }
cxx = { workspace = true, optional = true }
task_cxx_macros = { path = "../task_cxx_macros", optional = true }

[dev-dependencies]
testing = { path = "../testing" }

[build-dependencies]
cxx-build = { workspace = true, optional = true }
task_cxx_codegen = { path = "../task_cxx_codegen", optional = true }

[features]
# Off by default so default workspace builds need no C++ toolchain.
default = []
cxx = [
    "dep:cxx",
    "dep:cxx-build",
    "dep:task_cxx_codegen",
    "dep:task_cxx_macros",
    "dep:task",
    "dep:task_graph",
    "dep:task_cxx",
    "task_cxx/cxx",
]

[lints]
workspace = true
