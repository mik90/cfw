# Nextest repository configuration.
#
# The `default-miri` profile is auto-activated by `cargo miri nextest run`
# (it fires when MIRI_SYSROOT is set, which `cargo miri` exports).
# OS-dependent tests are individually ignored under Miri. Tests that hang
# are terminated after three minutes.
[profile.default-miri]
slow-timeout = { period = "60s", terminate-after = 3 }
