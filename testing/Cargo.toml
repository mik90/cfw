[package]
name = "testing"
version = "0.1.0"
edition = "2024"

[dependencies]
task = { path = "../task", default-features = false, features = ["testing"] }
# Unit test support is a thin wrapper over simulation
simulation_executor = { path = "../simulation_executor", default-features = false }
iceoryx2 = { workspace = true, optional = true }

[features]
default = ["iceoryx2"]
iceoryx2 = ["task/iceoryx2", "simulation_executor/iceoryx2", "dep:iceoryx2"]

[dev-dependencies]
task_macros = { path = "../task_macros" }

[lints]
workspace = true
