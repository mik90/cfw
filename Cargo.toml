
[workspace]
members = [
    "exact_replay_executor",
    "simulation_executor",
    "task",
    "task_macros",
    "test_tasks",
    "live_executor",
    "live_replay_executor",
    "testing",
    "logging",
    "base",
    "examples/fizz_buzz_application",
    "examples/facet_serialization",
    "examples/profiling",
]
resolver = "3"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
wrong_self_convention = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
dead_code = "allow" # Not ideal, but im iterating a lot and this is getting chatty

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.profiling]
# See run_flamegraph.sh for how to run
inherits = "release" # Inherit baseline configurations from the release profile
debug = true         # Preserve debug symbols (vital for tool mappings)

[profile.vtune]
# Build with `cargo b --profile vtune`
# VTune can't demangle rust symbols, so this doesn't really work well.
inherits = "release" # Inherit baseline configurations from the release profile
debug = true         # Preserve debug symbols (vital for tool mappings)
lto = false          # Keep false; VTune struggles with LTO whole-program optimization
strip = "none"       # Explicitly prevent symbol stripping
split-debuginfo = "off" # Ensures symbols stay packed inside the binary
