[package]
name = "task_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full", "visit-mut"] }

[dev-dependencies]
testing = { path = "../testing", default-features = false }
task = { path = "../task" }
task_graph = { path = "../task_graph" }

[lints]
workspace = true
