[package]
name = "cxx_fizz_buzz"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
task = { path = "../../task" }
task_graph = { path = "../../task_graph" }
task_cxx = { path = "../../task_cxx", optional = true }
task_cxx_macros = { path = "../../task_cxx_macros", optional = true }
cxx = { workspace = true, optional = true }

[build-dependencies]
cxx-build = { workspace = true, optional = true }

[features]
# Opt in to the C++ bridge; off by default so workspace builds need no C++ toolchain.
default = []
cxx = ["dep:cxx", "dep:cxx-build", "dep:task_cxx", "task_cxx/cxx", "dep:task_cxx_macros"]

[dev-dependencies]
testing = { path = "../../testing" }
test_tasks = { path = "../../test_tasks" }
live_executor = { path = "../../live_executor" }

[lints]
workspace = true
