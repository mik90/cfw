[package]
name = "base"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "serde"]
std = ["crossbeam-queue/std"]
serde = ["std", "dep:serde"]

[dependencies]
# `alloc` is enough for ArrayQueue; avoids pulling std into no_std builds.
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { workspace = true, optional = true } # Allows serde loggability for task types

[dev-dependencies]
criterion = "0.5"
serde_json = { workspace = true }
googletest.workspace = true

[[bench]]
name = "mpsc_benchmark"
harness = false

[lints]
workspace = true
